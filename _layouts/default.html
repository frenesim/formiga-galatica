{%- assign t = site.data.i18n[page.lang] | default: site.data.i18n.pt -%}
<!doctype html>
<html lang="{{ page.lang | default: 'pt' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% seo %}
</head>
<body>
  {% include header.html t=t %}
  <main>
    {{ content }}
  </main>
  {% include footer.html t=t %}
</body>
</html>

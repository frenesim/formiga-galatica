{%- assign t = include.t -%}
<section id="contacto" class="contact">
  <div class="wrap">
    <h2>{{ t.contact_title }}</h2>
    <p class="lead">{{ t.contact_lead }}</p>
    <p><a class="button" href="{{ site.company.calendly }}" target="_blank" rel="noopener">{{ t.cta_call }} →</a></p>

    <div class="contact-grid">
      <div>
        <h3>{{ t.contact_other }}</h3>
        <ul class="plain">
          <li>💬 <a href="https://wa.me/{{ site.company.whatsapp }}?text={{ t.wa_text | uri_escape }}" target="_blank" rel="noopener">WhatsApp</a></li>
          <li>✉️ <a href="mailto:{{ site.company.email }}">{{ site.company.email }}</a></li>
          <li>📞 <a href="tel:{{ site.company.phone | remove: ' ' }}">{{ site.company.phone }}</a></li>
        </ul>
      </div>
      <form action="https://formsubmit.co/{{ site.company.email }}" method="POST">
        <h3>{{ t.form_title }}</h3>
        <input type="hidden" name="_subject" value="{{ t.form_subject }}">
        <input type="hidden" name="_template" value="table">
        <input type="text" name="_honey" style="display:none">
        <label>{{ t.form_name }}<input name="nome" required></label>
        <label>{{ t.form_contact }}<input name="contacto" required></label>
        <label>{{ t.form_msg }}<textarea name="mensagem" rows="4" required></textarea></label>
        <button type="submit">{{ t.form_send }}</button>
      </form>
    </div>
  </div>
</section>

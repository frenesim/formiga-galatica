{%- assign t = include.t -%}
<header class="site-header">
  <div class="wrap bar">
    <a class="brand" href="{{ t.home_url | relative_url }}"><img class="logo-light" src="{{ '/assets/brand/icon-soft.svg' | relative_url }}" alt="" width="36" height="36"><img class="logo-dark" src="{{ '/assets/brand/icon-ink.svg' | relative_url }}" alt="" width="36" height="36"> Formiga Galática</a>
    <nav>
      <a href="{{ t.diag_url | relative_url }}">{{ t.nav_diag }}</a>
      <a href="{{ t.notes_url | relative_url }}">{{ t.nav_notes }}</a>
      <a href="{{ t.home_url | relative_url }}#trabalho">{{ t.nav_work }}</a>
      <a href="#contacto">{{ t.nav_contact }}</a>
      {%- if page.alt_url %}
      <a class="lang" href="{{ page.alt_url | relative_url }}" hreflang="{{ t.other_lang }}">{{ t.other_lang | upcase }}</a>
      {%- endif %}
      <button type="button" class="theme" id="theme-toggle" aria-label="{{ t.theme_toggle }}" title="{{ t.theme_toggle }}"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button>
    </nav>
  </div>
</header>
<script>
  document.getElementById('theme-toggle').addEventListener('click', function () {
    var root = document.documentElement;
    var dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    var next = dark ? 'light' : 'dark';
    root.dataset.theme = next;
    try { localStorage.setItem('theme', next); } catch (e) {}
  });
</script>
